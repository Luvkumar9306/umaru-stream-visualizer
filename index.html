<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Umaru Keyboard Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #00ff00; /* Chroma key green for streaming */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container {
            position: relative;
            width: 800px;
            height: 600px;
        }

        /* Umaru Base Character (Simple CSS Art) */
        .character {
            position: absolute;
            bottom: 150px;
            left: 200px;
            width: 300px;
            height: 350px;
            background-color: #ff9900; /* Orange hoodie */
            border-radius: 150px 150px 0 0;
            border: 5px solid #333;
            z-index: 2;
        }

        /* Face */
        .face {
            position: absolute;
            top: 50px;
            left: 40px;
            width: 220px;
            height: 200px;
            background-color: #ffe0bd; /* Skin tone */
            border-radius: 110px;
            border: 5px solid #333;
        }

        .eye {
            position: absolute;
            top: 80px;
            width: 25px;
            height: 40px;
            background-color: #333;
            border-radius: 50%;
        }

        .eye.left { left: 40px; }
        .eye.right { right: 40px; }

        .blush {
            position: absolute;
            top: 100px;
            width: 30px;
            height: 15px;
            background-color: #ff9999;
            border-radius: 50%;
            opacity: 0.6;
        }
        .blush.left { left: 20px; }
        .blush.right { right: 20px; }

        .mouth {
            position: absolute;
            top: 130px;
            left: 95px;
            width: 30px;
            height: 15px;
            border-bottom: 5px solid #333;
            border-radius: 50%;
        }

        /* Keyboard and Mouse Props */
        .desk {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 700px;
            height: 20px;
            background-color: #8b4513;
            border: 5px solid #333;
            border-radius: 10px;
            z-index: 1;
        }

        .keyboard {
            position: absolute;
            bottom: 70px;
            left: 150px;
            width: 300px;
            height: 80px;
            background-color: #e0e0e0;
            border: 5px solid #333;
            border-radius: 10px;
            transform: skewX(-20deg);
            z-index: 3;
        }

        .mousepad {
            position: absolute;
            bottom: 70px;
            right: 150px;
            width: 150px;
            height: 100px;
            background-color: #333;
            border-radius: 10px;
            transform: skewX(-20deg);
            z-index: 1;
        }

        .mouse {
            position: absolute;
            bottom: 80px;
            right: 180px;
            width: 60px;
            height: 80px;
            background-color: #fff;
            border: 5px solid #333;
            border-radius: 30px;
            z-index: 3;
            transition: transform 0.1s;
        }

        /* Hands */
        .hand {
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: #ff9900;
            border: 5px solid #333;
            border-radius: 40px;
            z-index: 4;
            transition: top 0.05s, transform 0.05s;
        }

        /* Left Hand (Keyboard) */
        .hand.left {
            top: 350px;
            left: 180px;
        }
        
        .hand.left.typing {
            top: 420px;
            transform: scaleY(0.8);
            background-color: #ffe0bd;
        }

        /* Right Hand (Mouse) */
        .hand.right {
            top: 420px;
            right: 210px;
            background-color: #ffe0bd;
        }

    </style>
</head>
<body>

<div id="container">
    <div class="character">
        <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="blush left"></div>
            <div class="blush right"></div>
            <div class="mouth"></div>
        </div>
    </div>
    
    <div class="hand left" id="left-hand"></div>
    <div class="hand right" id="right-hand"></div>

    <div class="desk"></div>
    <div class="keyboard"></div>
    <div class="mousepad"></div>
    <div class="mouse" id="mouse"></div>
</div>

<script>
    const leftHand = document.getElementById('left-hand');
    const rightHand = document.getElementById('right-hand');
    const mouse = document.getElementById('mouse');
    const container = document.getElementById('container');

    let keysPressed = {};

    // Keyboard Logic
    window.addEventListener('keydown', (e) => {
        if (!keysPressed[e.key]) {
            keysPressed[e.key] = true;
            leftHand.classList.add('typing');
        }
    });

    window.addEventListener('keyup', (e) => {
        keysPressed[e.key] = false;
        
        // Check if any keys are still pressed
        let anyKeyPressed = Object.values(keysPressed).some(val => val);
        if (!anyKeyPressed) {
            leftHand.classList.remove('typing');
        }
    });

    // Mouse Logic
    window.addEventListener('mousemove', (e) => {
        // Calculate relative position within the window
        let xPercent = e.clientX / window.innerWidth;
        let yPercent = e.clientY / window.innerHeight;

        // Move the mouse prop
        let mouseX = -20 + (xPercent * 40); // Move between -20px and +20px
        let mouseY = -20 + (yPercent * 40);
        
        mouse.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
        rightHand.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
    });

    // Mouse click logic (optional, makes right hand bop)
    window.addEventListener('mousedown', () => {
        rightHand.style.transform += ' scaleY(0.8)';
    });
    window.addEventListener('mouseup', () => {
        rightHand.style.transform = rightHand.style.transform.replace(' scaleY(0.8)', '');
    });

</script>

</body>
</html>
